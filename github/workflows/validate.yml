name: Cash Flow Model
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  calculations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.9', '3.12']
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_repository.py
      - run: node --check smb_forecast/web/app.js
      - name: Verify installed package and bundled resources
        run: |
          python -m pip install --target "$RUNNER_TEMP/forecast-install" .
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/forecast-install" python -c 'from importlib import resources; from smb_forecast.model import loads, run_model; r=resources.files("smb_forecast"); assert len(run_model(loads(r.joinpath("sample.json").read_text()))["scenarios"]) == 4; assert r.joinpath("web/index.html").is_file()'
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cash-flow-dashboard-previews
          path: output/*.png
          if-no-files-found: ignore
          retention-days: 7
